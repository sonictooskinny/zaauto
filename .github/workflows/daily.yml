
name: Daily Cairo Restaurant Lead Finder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Find restaurant leads
        run: python lead_finder.py

      - name: Save leads CSV
        uses: actions/upload-artifact@v4
        with:
          name: cairo-restaurant-leads
          path: "*.csv"
          if-no-files-found: warn
